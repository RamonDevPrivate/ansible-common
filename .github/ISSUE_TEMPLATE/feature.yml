---
name: Feature request
description: Suggest a new capability or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem should the collection solve?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior
      description: Describe the expected result. A playbook example is optional.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
