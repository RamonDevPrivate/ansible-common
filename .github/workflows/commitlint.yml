---
name: Commitlint

on:
  push:

permissions: {}

concurrency:
  group: commitlint-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Lint commits
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # required to resolve the pushed commit range
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Install tooling
        run: uv sync --locked --only-group commit
      - name: Lint pushed commits
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          start="$BEFORE"

          # new branch or force push: fall back to whatever is not on main yet
          if ! git cat-file -e "${start}^{commit}" 2>/dev/null; then
            start="origin/main"
          fi

          if [ "$(git rev-parse "$start")" = "$AFTER" ]; then
            echo "No new commits to lint."
            exit 0
          fi

          uv run --locked --only-group commit cz check --rev-range "${start}..${AFTER}"
