# antsibull-docs configuration for docs/build.sh
breadcrumbs = true
indexes = true
use_html_blobs = false
add_antsibull_docs_version = true

collection_url = {
  * = "https://github.com/RamonDevPrivate/ansible-common"
}

collection_install = {
  * = "ansible-galaxy collection install git+https://github.com/RamonDevPrivate/ansible-common.git#/ansible_collections/ramondevprivate/common/"
}
