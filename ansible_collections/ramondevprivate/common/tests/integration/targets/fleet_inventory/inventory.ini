# ansible-test sets a placeholder interpreter that only its own inventory overrides; the delegated probe needs a real one
probe ansible_connection=local ansible_python_interpreter="{{ ansible_playbook_python }}"
# A probe host whose connection fails on the controller, before any SSH (unknown connection plugin)
probe-broken ansible_connection=does_not_exist

[fleet]
host-a ansible_connection=local
host-b ansible_connection=local
host-c ansible_connection=local
